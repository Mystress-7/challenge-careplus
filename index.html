<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Modular</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/assets/css/calendar.css" />
  </head>
  <body class="bg-light">
    <main class="container py-5 d-flex justify-content-center">
      <div
        class="calendar-card shadow-sm border-0 bg-white"
        id="calendarComponent"
      >
        <div class="p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="text-primary fw-bold mb-0">ABRIL 2026</h5>
            <a href="#" class="btn-ver-mais" id="btnExpand">Ver mais</a>
          </div>

          <div class="calendar-grid-header mb-2">
            <div>D</div>
            <div>S</div>
            <div>T</div>
            <div>Q</div>
            <div>Q</div>
            <div>S</div>
            <div>S</div>
          </div>
          <div class="calendar-grid" id="calendarDays"></div>
        </div>
      </div>
    </main>

    <aside class="custom-side-panel shadow" id="sidePanel">
      <div
        class="panel-header p-4 border-bottom d-flex justify-content-between align-items-center bg-white"
      >
        <h6 class="fw-bold mb-0">Agenda Detalhada</h6>
        <button class="btn-close" id="btnClose"></button>
      </div>
      <div class="panel-body p-4" id="appointmentList"></div>
    </aside>

    <script type="module" src="src/scripts/main.js"></script>
  </body>
</html>
